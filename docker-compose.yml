services:
  # Dịch vụ Database MongoDB
  mongodb:
    image: mongo:latest
    container_name: nammongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Dịch vụ ứng dụng Product API
  app:
    build: .
    container_name: product-api-container
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/product_db
    depends_on:
      mongodb:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "async function check() { try { const res = await fetch('http://localhost:5000/health'); process.exit(res.ok ? 0 : 1); } catch (e) { process.exit(1); } } check();"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data: