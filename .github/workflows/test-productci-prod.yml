name: Product CI/CD Pipeline Prod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # JOB 1: Continuous Integration (CI) - Test code
  integration-test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Start Product API Server in background
        env:
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/product_db_test
        run: |
          npm start &
          sleep 10

      - name: Run Healthcheck Test
        run: |
          echo "Testing /health endpoint..."
          curl -f http://localhost:5000/health
          echo -e "\nCI Test Passed: Database connected and API is healthy!"

  # JOB 2: Continuous Delivery (CD) - Build & Push to Docker Hub
  build-and-push:
    needs: integration-test # Bắt buộc Job CI chạy thành công thì mới chạy Job này
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-api:latest