name: Product CI Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-node:
    runs-on: ubuntu-latest

    steps:
    # 1. Kéo mã nguồn từ repository về máy ảo của GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Node.js (phiên bản 24 đồng bộ với máy bạn)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 3. Cài đặt các thư viện phụ thuộc từ package.json
    - name: Install dependencies
      run: npm install

    # 4. Chạy kiểm tra đơn giản
    - name: Run CI Test check
      run: |
        echo "Node version:"
        node -v
        echo "CI Pipeline test passed successfully!"